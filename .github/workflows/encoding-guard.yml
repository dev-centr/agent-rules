# Reusable encoding guard: fails when tracked text files contain double-encoded UTF-8 (mojibake).
# Backstop for the machine-wide pre-commit hook (tools/encoding-guard). Call it from any repo:
#
#   name: Encoding guard
#   on: { push: { branches: [main] }, pull_request: {} }
#   jobs:
#     encoding:
#       uses: dev-centr/agent-rules/.github/workflows/encoding-guard.yml@main
#
# Intentional examples: "mojibake-guard: allow" on the line, or globs in .encoding-allow.
name: Encoding guard

on:
  workflow_call:
    inputs:
      allow-non-utf8:
        description: Only warn (instead of fail) on text files that are not valid UTF-8
        type: boolean
        default: false
      guard-ref:
        description: dev-centr/agent-rules ref that supplies check-mojibake.mjs
        type: string
        default: main
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mojibake:
    name: Check for mojibake
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Plain git instead of actions/checkout: no submodule handling (a stray gitlink without a
      # .gitmodules entry breaks checkout's cleanup) and no Node runtime deprecation churn.
      - name: Check out caller (no submodules)
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Fetch guard script
        run: |
          if [ "$GITHUB_REPOSITORY" = "dev-centr/agent-rules" ] && [ -f tools/encoding-guard/check-mojibake.mjs ]; then
            cp tools/encoding-guard/check-mojibake.mjs "$RUNNER_TEMP/check-mojibake.mjs"
          else
            curl -fsSL "https://raw.githubusercontent.com/dev-centr/agent-rules/${GUARD_REF}/tools/encoding-guard/check-mojibake.mjs" -o "$RUNNER_TEMP/check-mojibake.mjs"
          fi
        env:
          GUARD_REF: ${{ inputs.guard-ref || 'main' }}
      - name: Scan tracked files
        run: node "$RUNNER_TEMP/check-mojibake.mjs" ${{ inputs.allow-non-utf8 && '--allow-non-utf8' || '' }}
